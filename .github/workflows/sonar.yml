name: Java Maven CI-CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy Java Application
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Verify Java and Maven
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Build and test application
      - name: Build with Maven
        run: mvn -B clean verify

      # 5. Find generated JAR
      - name: Find application JAR
        id: jar
        shell: bash
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*.original' -print -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "JAR file not found!"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_OUTPUT"

          echo "Generated JAR: $JAR_FILE"

      # 6. Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 7. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 8. Upload JAR to S3
      - name: Upload JAR to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          JAR_FILE: ${{ steps.jar.outputs.JAR_FILE }}
        run: |
          S3_KEY="releases/${GITHUB_SHA}/app.jar"

          aws s3 cp "$JAR_FILE" \
            "s3://${S3_BUCKET}/${S3_KEY}"

          echo "S3_KEY=$S3_KEY" >> "$GITHUB_ENV"

          echo "JAR uploaded successfully!"

      # 9. Deploy to private EC2 using SSM
      - name: Deploy to EC2 using SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        shell: bash
        run: |
          set -euo pipefail

          COMMANDS=$(jq -n \
            --arg bucket "$S3_BUCKET" \
            --arg key "$S3_KEY" \
            --arg region "$AWS_REGION" \
            '[
              "set -e",
              "aws s3 cp s3://\($bucket)/\($key) /opt/myapp/app.jar.tmp --region \($region)",
              "chmod 644 /opt/myapp/app.jar.tmp",
              "mv /opt/myapp/app.jar.tmp /opt/myapp/app.jar",
              "systemctl restart myapp",
              "systemctl is-active myapp"
            ]')

          PARAMETERS=$(jq -n \
            --argjson commands "$COMMANDS" \
            '{commands: $commands}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Java Maven GitHub Actions deployment" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment result
          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Current deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Application deployed successfully!"
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed!"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out!"
          exit 1
