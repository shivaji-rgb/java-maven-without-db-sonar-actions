
name: Java Maven CI-CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy Java Application
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Verify Java and Maven
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # 4. Build and test application
      - name: Build with Maven
        run: mvn -B clean verify
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail

          mvn -B \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectName="java-maven-without-db-sonar-actions" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.qualitygate.wait=true
      # 5. Find generated JAR
      - name: Find application JAR
        id: jar
        shell: bash
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*.original' -print -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "JAR file not found!"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "Generated JAR: $JAR_FILE"

      # 6. Debug GitHub OIDC Claims
      - name: Debug GitHub OIDC Claims
        shell: bash
        run: |
          set -euo pipefail

          echo "========== GitHub Context =========="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Branch     : $GITHUB_REF"
          echo "Actor      : $GITHUB_ACTOR"
          echo "Event      : $GITHUB_EVENT_NAME"

          echo "========== Expected OIDC Subject =========="
          echo "repo:${GITHUB_REPOSITORY}:ref:${GITHUB_REF}"

          echo "========== Request OIDC Token =========="
          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Unable to retrieve OIDC token"
            exit 1
          fi

          echo "========== Actual OIDC Claims =========="
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | tr '_-' '/+')

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "$PAYLOAD" | base64 -d | jq '{
            sub,
            aud,
            repository,
            repository_owner,
            ref,
            event_name
          }'

      # 7. Authenticate with AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 8. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 9. Upload JAR to S3
      - name: Upload JAR to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          JAR_FILE: ${{ steps.jar.outputs.JAR_FILE }}
        shell: bash
        run: |
          set -euo pipefail

          S3_KEY="releases/${GITHUB_SHA}/app.jar"

          aws s3 cp "$JAR_FILE" \
            "s3://${S3_BUCKET}/${S3_KEY}"

          echo "S3_KEY=$S3_KEY" >> "$GITHUB_ENV"

          echo "JAR uploaded successfully!"
            # Debug EC2 and SSM connectivity
      - name: Debug EC2 SSM Status
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "========== AWS Account =========="
          aws sts get-caller-identity

          echo "========== EC2 Instance Status =========="
          aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[].Instances[].{
              InstanceId:InstanceId,
              State:State.Name,
              IAMProfile:IamInstanceProfile.Arn
            }'

          echo "========== SSM Managed Instance Status =========="
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'InstanceInformationList[].{
              InstanceId:InstanceId,
              PingStatus:PingStatus,
              AgentVersion:AgentVersion,
              PlatformName:PlatformName
            }'
     
      # 10. Deploy Java application to private EC2 using SSM
      - name: Deploy to EC2 using SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          S3_KEY: releases/${{ github.sha }}/app.jar
        shell: bash
        run: |
          set -euo pipefail

          COMMANDS=$(jq -n \
            --arg bucket "$S3_BUCKET" \
            --arg key "$S3_KEY" \
            --arg region "$AWS_REGION" \
            '[
              "set -e",

              "echo Creating application directory",
              "mkdir -p /opt/myapp",

              "echo Checking Java installation",
              "command -v java",

              "echo Downloading application JAR",
              "aws s3 cp s3://\($bucket)/\($key) /opt/myapp/app.jar.tmp --region \($region)",

              "chmod 644 /opt/myapp/app.jar.tmp",
              "mv /opt/myapp/app.jar.tmp /opt/myapp/app.jar",

              "echo Creating systemd service",
              "cat > /etc/systemd/system/myapp.service <<EOF\n[Unit]\nDescription=FreshDrop Java Spring Boot Application\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/opt/myapp\nExecStart=$(command -v java) -jar /opt/myapp/app.jar\nSuccessExitStatus=143\nRestart=always\nRestartSec=10\n\n[Install]\nWantedBy=multi-user.target\nEOF",

              "echo Reloading systemd",
              "systemctl daemon-reload",

              "echo Enabling application service",
              "systemctl enable myapp",

              "echo Restarting application",
              "systemctl restart myapp",

              "sleep 10",

              "echo Checking application status",
              "systemctl is-active myapp",

              "echo Deployment completed"
            ]')

          PARAMETERS=$(jq -n \
            --argjson commands "$COMMANDS" \
            '{commands: $commands}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Java Spring Boot deployment" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Java application deployed successfully!"
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed!"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out!"
          exit 1


            sleep 5
          done

          echo "Deployment timed out!"
          exit 1
